name: Emulator test

on:
  push:
    branches: [ "main" ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Fetch whisper.cpp
        run: git clone --depth 1 --branch v1.9.5 https://github.com/ggml-org/whisper.cpp app/src/main/cpp/whisper.cpp

      - name: Test media
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg > /dev/null
          mkdir -p app/src/androidTest/assets
          cp app/src/main/cpp/whisper.cpp/samples/jfk.wav app/src/androidTest/assets/
          ffmpeg -loglevel error -f lavfi -i "color=c=red:s=640x360:d=5" -f lavfi -i "color=c=blue:s=640x360:d=7" \
            -i app/src/androidTest/assets/jfk.wav -filter_complex "[0][1]concat=n=2:v=1:a=0[v]" \
            -map "[v]" -map 2:a -c:v libx264 -pix_fmt yuv420p -c:a aac -shortest app/src/androidTest/assets/test.mp4
          curl -sSfL -o app/src/androidTest/assets/four_speakers.wav https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/0-four-speakers-zh.wav
          # два голоса: Кеннеди → другой человек → снова Кеннеди
          ffmpeg -loglevel error -i app/src/androidTest/assets/jfk.wav -ss 27.6 -to 37.9 -i app/src/androidTest/assets/four_speakers.wav -i app/src/androidTest/assets/jfk.wav \
            -filter_complex "[0]apad=pad_dur=1[a];[1]apad=pad_dur=1[b];[a][b][2]concat=n=3:v=0:a=1[o]" -map "[o]" -ar 16000 -ac 1 app/src/androidTest/assets/two_speakers.wav

      - name: Fetch sherpa-onnx (speaker diarization)
        run: |
          V=v1.13.8
          curl -sSfL -o sherpa.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/$V/sherpa-onnx-$V-android.tar.bz2
          tar xjf sherpa.tar.bz2
          mkdir -p app/src/main/jniLibs
          for a in arm64-v8a x86_64; do mkdir -p app/src/main/jniLibs/$a; cp jniLibs/$a/libsherpa-onnx-jni.so jniLibs/$a/libonnxruntime.so app/src/main/jniLibs/$a/; done
          ls -la app/src/main/jniLibs/*
          curl -sSfL -o seg.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/speaker-segmentation-models/sherpa-onnx-pyannote-segmentation-3-0.tar.bz2
          tar xjf seg.tar.bz2
          mkdir -p app/src/main/assets/diarization
          cp sherpa-onnx-pyannote-segmentation-3-0/model.onnx app/src/main/assets/diarization/segmentation.onnx

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.7"

      - name: Install NDK (with retries)
        run: |
          for i in 1 2 3 4; do
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;27.2.12479018" > /dev/null && break
            echo "retry $i"; sleep 20
          done

      - name: Build test APKs
        run: gradle assembleDebug assembleDebugAndroidTest --no-daemon -PtestAbi=x86_64

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run on emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          ram-size: 4096M
          disable-animations: true
          script: bash .github/run_emulator_test.sh

      - name: Publish results
        if: always()
        run: |
          mkdir -p ci && cd ci
          git init -q && git checkout -q -b ci-test
          git -c user.name=ci -c user.email=ci@local add -A . && git -c user.name=ci -c user.email=ci@local commit -qm "test ${GITHUB_SHA}" --allow-empty
          git push -f "https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git" ci-test
